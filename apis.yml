aid: seqera-labs
name: Seqera Labs
description: >-
  Seqera (Seqera Labs) builds open, cloud-based software for scientific data
  analysis at scale. It is the company behind Nextflow, the widely adopted
  open-source workflow orchestration engine, and the Seqera Platform (formerly
  Nextflow Tower) for launching, monitoring, and governing data pipelines across
  cloud and HPC compute. Its product family also includes Wave (on-demand
  container provisioning), Fusion (a distributed file system for cloud pipelines),
  Data Studios (interactive analysis environments), and MultiQC. The Seqera
  Platform exposes a REST API (OpenAPI 3.0.1, 250 operations) plus a CLI (tw) and
  Python automation (seqerakit), and implements the GA4GH Workflow Execution
  Service (WES) standard.
