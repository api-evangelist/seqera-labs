        logFile:
          maxLength: 255
          type: string
        manifest:
          $ref: '#/components/schemas/WfManifest'
        nextflow:
          $ref: '#/components/schemas/WfNextflow'
        operationId:
          maxLength: 110
          type: string
        outFile:
