openapi: 3.0.1
info:
  contact:
    email: info@seqera.io
    url: https://seqera.io
  description: Seqera Platform services API
  title: Seqera actions API
  version: 1.181.0
tags:
- description: Pipeline actions
  name: actions
paths:
  /actions:
    get:
      description: Lists all available actions in a user context, enriched by `attributes`. Append `?workspaceId` to list actions in a workspace context.
      operationId: ListActions
      parameters:
      - description: Workspace numeric identifier
        in: query
        name: workspaceId
        schema:
          format: int64
          type: integer
      - description: 'Additional attribute values to include in the response (`labels`). Returns an empty value (`labels: null`) if omitted.'
        in: query
        name: attributes
        schema:
          items:
            $ref: '#/components/schemas/ActionQueryAttribute'
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListActionsResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        '403':
          description: Operation not allowed
      security:
      - BearerAuth: []
      summary: List actions
      tags:
      - actions
    post:
      description: Creates a new pipeline action. Append `?workspaceId` to associate the action with the given workspace.
      operationId: CreateAction
      parameters:
      - description: Workspace numeric identifier
        in: query
        name: workspaceId
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActionRequest'
        description: Action create request
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateActionResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        '403':
          description: Operation not allowed
      security:
      - BearerAuth: []
      summary: Create action
      tags:
      - actions
  /actions/cron/resolve:
    post:
      operationId: ResolveCronExpression
      parameters:
      - explode: false
        in: query
        name: workspaceId
        schema:
          format: int64
          nullable: true
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties:
                type: string
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ResolveCronExpression 200 response
      security:
      - BearerAuth: []
      summary: Resolve a schedule description to a cron expression
      tags:
      - actions
  /actions/types:
    get:
      description: Lists the supported event types that trigger a pipeline action. Append `?workspaceId` to list event types in a workspace context.
      operationId: ListActionTypes
      parameters:
      - description: Workspace numeric identifier
        in: query
        name: workspaceId
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEventTypesResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        '403':
          description: Operation not allowed
      security:
      - BearerAuth: []
      summary: List action event types
      tags:
      - actions
  /actions/validate:
    get:
      description: Confirms the validity of the given action name. Append `?name=<your_action_name>`.
      operationId: ValidateActionName
      parameters:
      - description: Workspace numeric identifier
        in: query
        name: workspaceId
        schema:
          format: int64
          type: integer
      - description: Action name to validate
        in: query
        name: name
        schema:
          type: string
      responses:
        '204':
          description: OK - No content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        '403':
          description: Operation not allowed
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Duplicate element
      security:
      - BearerAuth: []
      summary: Validate action name
      tags:
      - actions
  /actions/{actionId}:
    delete:
      description: Deletes the pipeline action identified by the given `actionId`.
      operationId: DeleteAction
      parameters:
      - description: Action string identifier
        in: path
        name: actionId
        required: true
        schema:
          type: string
      - description: Workspace numeric identifier
        in: query
        name: workspaceId
        schema:
          format: int64
          type: integer
      responses:
        '204':
          description: OK - No content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        '403':
          description: Operation not allowed
      security:
      - BearerAuth: []
      summary: Delete action
      tags:
      - actions
    get:
      description: Retrieves the details of the action identified by the given `actionId`.
      operationId: DescribeAction
      parameters:
      - description: Action string identifier
        in: path
        name: actionId
        required: true
        schema:
          type: string
      - description: Workspace numeric identifier
        in: query
        name: workspaceId
        schema:
          format: int64
          type: integer
      - description: 'Additional attribute values to include in the response (`labels`). Returns an empty value (`labels: null`) if omitted.'
        in: query
        name: attributes
        schema:
          items:
            $ref: '#/components/schemas/ActionQueryAttribute'
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeActionResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        '403':
          description: Operation not allowed
      security:
      - BearerAuth: []
      summary: Describe action
      tags:
      - actions
    put:
      description: Updates the details of the action identified by the given `actionId`. The `source` of an existing action cannot be changed.
      operationId: UpdateAction
      parameters:
      - description: Action string identifier
        in: path
        name: actionId
        required: true
        schema:
          type: string
      - description: Workspace numeric identifier
        in: query
        name: workspaceId
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActionRequest'
        description: Action update request
        required: true
      responses:
        '204':
          description: OK - No content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        '403':
          description: Operation not allowed
      security:
      - BearerAuth: []
      summary: Update action
      tags:
      - actions
  /actions/{actionId}/launch:
    post:
      description: Triggers the execution of the Tower Launch action identified by the given `actionId`.
      operationId: LaunchAction
      parameters:
      - description: Action string identifier
        in: path
        name: actionId
        required: true
        schema:
          type: string
      - description: Workspace numeric identifier
        in: query
        name: workspaceId
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaunchActionRequest'
        description: Action launch request
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaunchActionResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        '403':
          description: Operation not allowed
      security:
      - BearerAuth: []
      summary: Trigger Tower Launch action
      tags:
      - actions
  /actions/{actionId}/pause:
    post:
      description: Pauses or resumes the pipeline action identified by the given `actionId`.
      operationId: PauseAction
      parameters:
      - description: Action string identifier
        in: path
        name: actionId
        required: true
        schema:
          type: string
      - description: Workspace numeric identifier
        in: query
        name: workspaceId
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyBodyRequest'
      responses:
        '204':
          description: OK - No content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        '403':
          description: Operation not allowed
      security:
      - BearerAuth: []
      summary: Pause or resume action
      tags:
      - actions
components:
  schemas:
    UpdateActionRequest:
      properties:
        bucket:
          $ref: '#/components/schemas/BucketActionRequest'
        cron:
          $ref: '#/components/schemas/CronActionRequest'
        launch:
          $ref: '#/components/schemas/WorkflowLaunchRequest'
        name:
          type: string
      type: object
    ComputeEnv.Status:
      enum:
      - CREATING
      - AVAILABLE
      - DISABLED
      - DELETING
      - ERRORED
      - INVALID
      - DELETED
      type: string
    LaunchActionResponse:
      properties:
        workflowId:
          type: string
      type: object
    AltairPbsComputeConfig:
      allOf:
      - $ref: '#/components/schemas/AbstractGridConfig'
      title: Altair PBS configuration
      type: object
    AzBatchConfig:
      allOf:
      - $ref: '#/components/schemas/ComputeConfig'
      - properties:
          autoPoolMode:
            deprecated: true
            type: boolean
          deleteJobsOnCompletion:
            allOf:
            - $ref: '#/components/schemas/JobCleanupPolicy'
            nullable: true
            readOnly: true
          deleteJobsOnCompletionEnabled:
            nullable: true
            type: boolean
          deletePoolsOnCompletion:
            type: boolean
          deleteTasksOnCompletion:
            nullable: true
            type: boolean
          forge:
            $ref: '#/components/schemas/AzBatchForgeConfig'
          fusion2Enabled:
            type: boolean
          headJobCpus:
            description: Number of CPU slots reserved on the head pool VM for the Nextflow head job. Defaults to 1 so multiple head jobs can share a head pool VM; increase to dedicate more CPU and memory to each head job.
            example: 1
            format: int32
            nullable: true
            type: integer
          headJobMemoryMb:
            description: Memory in MiB reserved for the Nextflow head job container. When omitted, the value is derived from the head pool VM size as the per-slot share (vmMemory / vmCpus) multiplied by the requested slot count.
            example: 4096
            format: int32
            nullable: true
            type: integer
          headPool:
            type: string
          jobMaxWallClockTime:
            description: 'Maximum wall clock time for Azure Batch jobs before automatic termination. Accepts human-readable duration syntax (e.g., ''7d'', ''1d1h1m''). Defaults to 7d when not specified. Maximum: 180 days.'
            example: 7d
            nullable: true
            type: string
          managedIdentityClientId:
            nullable: true
            type: string
          managedIdentityHeadResourceId:
            nullable: true
            type: string
          managedIdentityPoolClientId:
            nullable: true
            type: string
          managedIdentityPoolResourceId:
            nullable: true
            type: string
          region:
            type: string
          subnetId:
            description: Azure VNet subnet resource ID for private network isolation. Requires Entra (service principal) credentials.
            example: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/myRg/providers/Microsoft.Network/virtualNetworks/myVnet/subnets/mySubnet
            nullable: true
            type: string
          terminateJobsOnCompletion:
            nullable: true
            type: boolean
          tokenDuration:
            type: string
          waveEnabled:
            type: boolean
          workerPool:
            type: string
        type: object
      title: Azure Batch configuration
      type: object
    Map.Entry_String.String_:
      properties:
        key:
          type: string
        value:
          type: string
      type: object
    SeqeraComputeConfig:
      allOf:
      - $ref: '#/components/schemas/ComputeConfig'
      - properties:
          defaultDataRetentionPolicy:
            type: boolean
          instanceTypeSize:
            allOf:
            - $ref: '#/components/schemas/SeqeraComputeCloudInstanceTypeSize'
            description: Size of the Data Studios instance (SMALL, MEDIUM, LARGE)
          region:
            type: string
        type: object
      title: Seqera Compute configuration
      type: object
    BucketActionEvent:
      allOf:
      - $ref: '#/components/schemas/Action.EventType'
      - properties:
          bucketName:
            type: string
          eventName:
            type: string
          provider:
            type: string
          recordCount:
            format: int32
            type: integer
        type: object
      title: Bucket action event
      type: object
    ForgeConfig:
      properties:
        allocStrategy:
          enum:
          - BEST_FIT
          - BEST_FIT_PROGRESSIVE
          - SPOT_CAPACITY_OPTIMIZED
          - SPOT_PRICE_CAPACITY_OPTIMIZED
          type: string
        allowBuckets:
          items:
            type: string
          type: array
        arm64Enabled:
          type: boolean
        bidPercentage:
          format: int32
          type: integer
        disposeOnDeletion:
          type: boolean
        dragenAmiId:
          type: string
        dragenEnabled:
          type: boolean
        dragenInstanceType:
          type: string
        ebsAutoScale:
          type: boolean
        ebsBlockSize:
          format: int32
          type: integer
        ebsBootSize:
          format: int32
          type: integer
        ec2KeyPair:
          type: string
        ecsConfig:
          type: string
        efsCreate:
          type: boolean
        efsId:
          type: string
        efsMount:
          type: string
        fargateHeadEnabled:
          type: boolean
        fsxMount:
          type: string
        fsxName:
          type: string
        fsxSize:
          format: int32
          type: integer
        fusionEnabled:
          type: boolean
        gpuEnabled:
          type: boolean
        imageId:
          type: string
        instanceTypes:
          items:
            type: string
          type: array
        maxCpus:
          format: int32
          type: integer
        minCpus:
          format: int32
          type: integer
        securityGroups:
          items:
            type: string
          type: array
        subnets:
          items:
            type: string
          type: array
        type:
          enum:
          - SPOT
          - EC2
          type: string
        vpcId:
          type: string
      type: object
    Action.ConfigType:
      discriminator:
        mapping:
          bucket: '#/components/schemas/BucketActionConfig'
          cron: '#/components/schemas/CronActionConfig'
          github: '#/components/schemas/GithubActionConfig'
          tower: '#/components/schemas/Action.TowerActionConfig'
        propertyName: discriminator
      oneOf:
      - $ref: '#/components/schemas/Action.TowerActionConfig'
      - $ref: '#/components/schemas/GithubActionConfig'
      - $ref: '#/components/schemas/BucketActionConfig'
      - $ref: '#/components/schemas/CronActionConfig'
      properties:
        discriminator:
          type: string
      type: object
    ActionQueryAttribute:
      enum:
      - labels
      type: string
      x-enum-varnames:
      - labels
    ListActionsResponse.ActionInfo:
      properties:
        config:
          $ref: '#/components/schemas/Action.ConfigType'
        dateCreated:
          format: date-time
          type: string
        endpoint:
          type: string
        error:
          type: string
        event:
          $ref: '#/components/schemas/Action.EventType'
        hint:
          type: string
        id:
          type: string
        labels:
          items:
            $ref: '#/components/schemas/LabelDbDto'
          type: array
        lastSeen:
          format: date-time
          type: string
        name:
          type: string
        nextExecution:
          format: date-time
          type: string
        pipeline:
          type: string
        source:
          $ref: '#/components/schemas/Action.Source'
        status:
          $ref: '#/components/schemas/Action.Status'
        usageCmd:
          type: string
      type: object
    GithubActionConfig:
      allOf:
      - $ref: '#/components/schemas/Action.ConfigType'
      - properties:
          events:
            items:
              type: string
            type: array
        type: object
      title: GitHub action config
      type: object
    DescribeActionResponse:
      properties:
        action:
          $ref: '#/components/schemas/ActionResponseDto'
      type: object
    LabelDbDto:
      properties:
        dateCreated:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        isDefault:
          type: boolean
        isDynamic:
          type: boolean
        isInterpolated:
          type: boolean
        name:
          type: string
        resource:
          type: boolean
        value:
          type: string
      type: object
    LaunchDbDto:
      properties:
        commitId:
          type: string
        computeEnv:
          $ref: '#/components/schemas/ComputeEnv_ComputeConfig_'
        configProfiles:
          items:
            type: string
          type: array
        configText:
          type: string
        dateCreated:
          format: date-time
          type: string
        entryName:
          type: string
        headJobCpus:
          format: int32
          type: integer
        headJobMemoryMb:
          format: int32
          type: integer
        id:
          type: string
        lastUpdated:
          format: date-time
          type: string
        launchContainer:
          type: string
        mainScript:
          type: string
        optimizationId:
          type: string
        optimizationTargets:
          type: string
        outputDir:
          description: Per-run output directory passed as Nextflow -output-dir (requires Nextflow 24.10.0 or later and workflow outputs syntax).
          nullable: true
          type: string
        paramsText:
          type: string
        pipeline:
          type: string
        pipelineSchemaId:
          format: int64
          type: integer
        postRunScript:
          type: string
        preRunScript:
          type: string
        pullLatest:
          type: boolean
        resume:
          type: boolean
        resumeLaunchId:
          type: string
        revision:
          type: string
        runName:
          type: string
        schemaName:
          type: string
        sessionId:
          type: string
        stubRun:
          type: boolean
        syntaxParser:
          enum:
          - v1
          - v2
          nullable: true
          type: string
        towerConfig:
          type: string
        userSecrets:
          items:
            type: string
          type: array
        workDir:
          type: string
        workspaceId:
          format: int64
          type: integer
        workspaceSecrets:
          items:
            type: string
          type: array
      type: object
    CreateActionResponse:
      properties:
        actionId:
          type: string
      type: object
    LocalComputeConfig:
      allOf:
      - $ref: '#/components/schemas/ComputeConfig'
      - properties:
          fusion2Enabled:
            type: boolean
          schedConfig:
            $ref: '#/components/schemas/SchedConfig'
          schedEnabled:
            type: boolean
          waveEnabled:
            type: boolean
        type: object
      title: Local execution configuration
      type: object
    ConfigEnvVariable:
      properties:
        compute:
          type: boolean
        head:
          type: boolean
        name:
          type: string
        value:
          type: string
      type: object
    PodCleanupPolicy:
      enum:
      - on_success
      - always
      - never
      type: string
      x-enum-varnames:
      - on_success
      - always
      - never
    ActionResponseDto:
      properties:
        config:
          $ref: '#/components/schemas/Action.ConfigType'
        dateCreated:
          format: date-time
          type: string
        error:
          type: string
        event:
          $ref: '#/components/schemas/Action.EventType'
        hookId:
          type: string
        hookUrl:
          type: string
        id:
          type: string
        labels:
          items:
            $ref: '#/components/schemas/LabelDbDto'
          type: array
        lastSeen:
          format: date-time
          type: string
        lastUpdated:
          format: date-time
          type: string
        launch:
          $ref: '#/components/schemas/LaunchDbDto'
        name:
          type: string
        nextExecution:
          format: date-time
          type: string
        source:
          $ref: '#/components/schemas/Action.Source'
        status:
          $ref: '#/components/schemas/Action.Status'
      type: object
    LsfComputeConfig:
      allOf:
      - $ref: '#/components/schemas/AbstractGridConfig'
      - properties:
          perJobMemLimit:
            type: boolean
          perTaskReserve:
            type: boolean
          unitForLimits:
            type: string
        type: object
      title: IBM LSF configuration
      type: object
    EksComputeConfig:
      allOf:
      - $ref: '#/components/schemas/K8sComputeConfig'
      - properties:
          clusterName:
            description: The AWS EKS cluster name
            type: string
          fusion2Enabled:
            type: boolean
          region:
            description: AWS region
            type: string
          waveEnabled:
            type: boolean
        type: object
      title: Amazon EKS cluster configuration
      type: object
    CreateActionRequest:
      properties:
        bucket:
          $ref: '#/components/schemas/BucketActionRequest'
        cron:
          $ref: '#/components/schemas/CronActionRequest'
        launch:
          $ref: '#/components/schemas/WorkflowLaunchRequest'
        name:
          type: string
        source:
          $ref: '#/components/schemas/Action.Source'
      type: object
    ListActionsResponse:
      properties:
        actions:
          items:
            $ref: '#/components/schemas/ListActionsResponse.ActionInfo'
          type: array
      type: object
    SeqeraComputeCloudInstanceTypeSize:
      enum:
      - SMALL
      - MEDIUM
      - LARGE
      type: string
    Action.TowerActionConfig:
      allOf:
      - $ref: '#/components/schemas/Action.ConfigType'
      - properties:
          discriminator:
            type: string
        type: object
      title: Tower Action Config
      type: object
    CronActionEvent:
      allOf:
      - $ref: '#/components/schemas/Action.EventType'
      - properties:
          scheduledTime:
            format: date-time
            type: string
          workflowId:
            type: string
        type: object
      title: Cron action event
      type: object
    ErrorResponse:
      properties:
        message:
          type: string
      required:
      - message
      type: object
    SchedConfig:
      properties:
        backendStrategy:
          description: Backend used by Intelligent Compute to run tasks. 'ECS' (AWS only, default) delegates task execution to AWS ECS; 'EC2' (AWS only) runs tasks directly on AWS EC2 instances; 'VM' runs tasks on cloud VMs (provider-agnostic).
          enum:
          - ECS
          - EC2
          - VM
          type: string
        diskAllocation:
          type: string
        fusionSnapshots:
          description: Enable Fusion snapshots so interrupted (e.g. spot-reclaimed) tasks can resume from a snapshot instead of restarting from scratch.
          type: boolean
        machineTypes:
          description: EC2 instance types for compute nodes. Leave empty to automatically select the most cost-effective types for each task.
          items:
            type: string
          type: array
        nvmeEnabled:
          description: When true, only use instance types providing local SSD (NVMe) storage. Maps to diskAllocation='nvme'.
          type: boolean
        pool:
          allOf:
          - $ref: '#/components/schemas/SchedConfig.Pool'
          description: Warm-pool configuration. When present and enabled, the scheduler maintains a pool of idle VMs ready to absorb incoming tasks with sub-5s start latency.
        predictionModel:
          description: 'Resource-prediction model used by Intelligent Compute to size tasks. Suggested values: ''none'' (default), ''qr/v1'', ''qr/v2''. Any other string is accepted.'
          type: string
        provisioningModel:
          enum:
          - spot
          - spotFirst
          - ondemand
          type: string
      type: object
    BucketActionRequest:
      properties:
        dataLinkId:
          type: string
        datasetId:
          type: string
        events:
          items:
            type: string
          type: array
        filter:
          type: string
        markerFile:
          type: string
      type: object
    CronActionRequest:
      properties:
        expression:
          type: string
        preset:
          type: string
        timezone:
          type: string
      type: object
    ListEventTypesResponse:
      properties:
        eventTypes:
          items:
            $ref: '#/components/schemas/EventType'
          type: array
      type: object
    GkeComputeConfig:
      allOf:
      - $ref: '#/components/schemas/K8sComputeConfig'
      - properties:
          clusterName:
            description: The GKE cluster name
            type: string
          fusion2Enabled:
            type: boolean
          region:
            description: The GKE cluster region - or - zone
            type: string
          waveEnabled:
            type: boolean
        type: object
      title: Google GKE cluster configuration
      type: object
    GoogleBatchConfig:
      allOf:
      - $ref: '#/components/schemas/ComputeConfig'
      - properties:
          bootDiskImage:
            type: string
