      - commandLine
      - projectName
      - runName
      - sessionId
      - submit
      - userName
      - workDir
      type: object
    TraceCreateRequest:
      properties:
        launchId:
          deprecated: true
          type: string
        projectName:
          type: string
        repository:
          type: string
        runName:
          type: string
        sessionId:
          type: string
        workflowId:
          type: string
      type: object
    WfStats:
      properties:
